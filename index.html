<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieFlix</title>

<style>
body {
    margin: 0;
    background-color: #111;
    font-family: Arial, sans-serif;
    color: white;
}

header {
    padding: 20px 40px;
    font-size: 28px;
    font-weight: bold;
    color: #e50914;
}

.section {
    padding: 20px 40px;
}

.section h2 {
    margin-bottom: 20px;
}

.movies {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
}

.movie {
    transition: transform 0.3s;
}

.movie img {
    width: 100%;
    border-radius: 8px;
    cursor: pointer;
}

.movie:hover {
    transform: scale(1.08);
}

.movie-title {
    margin-top: 8px;
    font-size: 14px;
    text-align: center;
}

@media(max-width: 600px){
    header {
        font-size: 20px;
        padding: 15px;
    }
    .section {
        padding: 15px;
    }
}
</style>
</head>
<body>

<header>MovieFlix</header>

<div class="section">
<h2>The 5 Best New Movies</h2>

<div class="movies">

    <!-- MOVIE 1 -->
    <div class="movie">
        <a href="https://www.youtube.com/watch?v=YOUR_TRAILER_LINK" target="_blank">
            <img src="images/heart-of-stone.jpg" alt="Heart of Stone">
        </a>
        <div class="movie-title">Heart of Stone</div>
    </div>

    <!-- MOVIE 2 -->
    <div class="movie">
        <a href="https://www.youtube.com/watch?v=YOUR_TRAILER_LINK" target="_blank">
            <img src="images/bat-mitzvah.jpg" alt="Bat Mitzvah">
        </a>
        <div class="movie-title">You Are So Not Invited To My Bat Mitzvah</div>
    </div>

    <!-- MOVIE 3 -->
    <div class="movie">
        <a href="https://www.youtube.com/watch?v=YOUR_TRAILER_LINK" target="_blank">
            <img src="images/living.jpg" alt="Living">
        </a>
        <div class="movie-title">Living</div>
    </div>

    <!-- MOVIE 4 -->
    <div class="movie">
        <a href="https://www.youtube.com/watch?v=YOUR_TRAILER_LINK" target="_blank">
            <img src="images/65.jpg" alt="65">
        </a>
        <div class="movie-title">65</div>
    </div>

    <!-- MOVIE 5 -->
    <div class="movie">
        <a href="https://www.youtube.com/watch?v=YOUR_TRAILER_LINK" target="_blank">
            <img src="images/missing.jpg" alt="Missing">
        </a>
        <div class="movie-title">Missing</div>
    </div>

</div>
</div>

</body>
</html>
