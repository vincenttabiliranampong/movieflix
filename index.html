<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieFlix</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background-color: #141414;
    color: white;
}

/* Navbar */
.navbar {
    position: fixed;
    width: 100%;
    padding: 20px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    z-index: 1000;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #e50914;
}

.nav-links a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-size: 14px;
}

.nav-links a:hover {
    color: #b3b3b3;
}

/* Hero Section */
.hero {
    height: 90vh;
    background: url('https://images.unsplash.com/photo-1524985069026-dd778a71c7b4') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: 50px;
}

.hero h1 {
    font-size: 60px;
    margin-bottom: 20px;
}

.hero p {
    max-width: 500px;
    margin-bottom: 20px;
    font-size: 18px;
}

.hero-buttons button {
    padding: 10px 25px;
    margin-right: 10px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    border-radius: 4px;
}

.play-btn {
    background-color: white;
    color: black;
}

.info-btn {
    background-color: rgba(109,109,110,0.7);
    color: white;
}

.play-btn:hover {
    background-color: #e6e6e6;
}

.info-btn:hover {
    background-color: rgba(109,109,110,0.4);
}

/* Movie Rows */
.row {
    margin: 20px 50px;
}

.row h2 {
    margin-bottom: 10px;
}

.row-posters {
    display: flex;
    overflow-x: auto;
    scroll-behavior: smooth;
}

.row-posters::-webkit-scrollbar {
    display: none;
}

.poster {
    max-height: 160px;
    margin-right: 10px;
    transition: transform 0.3s;
    cursor: pointer;
    border-radius: 4px;
}

.poster:hover {
    transform: scale(1.1);
}

/* Footer */
.footer {
    text-align: center;
    padding: 30px;
    color: #757575;
    font-size: 14px;
}
</style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">MovieFlix</div>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">TV Shows</a>
        <a href="#">Movies</a>
        <a href="#">My List</a>
    </div>
</div>

<!-- Hero Section -->
<div class="hero">
    <h1>Featured Movie</h1>
    <p>Watch the latest blockbuster movies and trending shows anytime, anywhere.</p>
    <div class="hero-buttons">
        <button class="play-btn">▶ Play</button>
        <button class="info-btn">More Info</button>
    </div>
</div>

<!-- Movie Rows -->
<div class="row">
    <h2>Trending Now</h2>
    <div class="row-posters">
        <img class="poster" src="https://via.placeholder.com/300x450" alt="">
        <img class="poster" src="https://via.placeholder.com/300x450" alt="">
        <img class="poster" src="https://via.placeholder.com/300x450" alt="">
        <img class="poster" src="https://via.placeholder.com/300x450" alt="">
        <img class="poster" src="https://via.placeholder.com/300x450" alt="">
    </div>
</div>

<div class="row">
    <h2>Top Rated</h2>
    <div class="row-posters">
        <img class="poster" src="https://via.placeholder.com/300x450" alt="">
        <img class="poster" src="https://via.placeholder.com/300x450" alt="">
        <img class="poster" src="https://via.placeholder.com/300x450" alt="">
        <img class="poster" src="https://via.placeholder.com/300x450" alt="">
        <img class="poster" src="https://via.placeholder.com/300x450" alt="">
    </div>
</div>

<div class="row">
    <h2>Action Movies</h2>
    <div class="row-posters">
        <img class="poster" src="https://via.placeholder.com/300x450" alt="">
        <img class="poster" src="https://via.placeholder.com/300x450" alt="">
        <img class="poster" src="https://via.placeholder.com/300x450" alt="">
        <img class="poster" src="https://via.placeholder.com/300x450" alt="">
        <img class="poster" src="https://via.placeholder.com/300x450" alt="">
    </div>
</div>

<!-- Footer -->
<div class="footer">
    © 2026 MovieFlix. All rights reserved.
</div>

</body>
</html>
