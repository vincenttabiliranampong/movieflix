<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieFlix</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background-color: #141414;
    color: white;
}

/* Navbar */
.navbar {
    position: fixed;
    width: 100%;
    padding: 15px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    z-index: 1000;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #e50914;
}

.nav-links {
    display: flex;
    gap: 20px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-size: 14px;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #b3b3b3;
}

/* Hero */

    /* Hero */
.hero {
    position: relative;
    height: 90vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 0 5%;
}

.bg-video {
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    transform: translate(-50%, -50%);
    object-fit: cover;
    z-index: -2;
}

.overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, #141414 10%, rgba(0,0,0,0.4));
    z-index: -1;
}
<div class="hero">
    <video autoplay muted loop playsinline class="bg-video">
        <source src="video/trailer.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="hero-content">
        <h1>Featured Movie</h1>
        <p>Watch the latest blockbuster movies and trending shows anytime, anywhere.</p>
        <div class="hero-buttons">
            <button class="play-btn">▶ Play</button>
            <button class="info-btn">More Info</button>
        </div>
    </div>
</div>
    
.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, #141414, transparent);
}

.hero-content {
    position: relative;
    max-width: 600px;
}

.hero h1 {
    font-size: 3rem;
    margin-bottom: 15px;
}

.hero p {
    font-size: 1rem;
    margin-bottom: 20px;
}

.hero-buttons button {
    padding: 10px 20px;
    margin-right: 10px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    border-radius: 4px;
}

.play-btn {
    background-color: white;
    color: black;
}

.info-btn {
    background-color: rgba(109,109,110,0.7);
    color: white;
}

/* Rows */
.row {
    margin: 30px 5%;
}

.row h2 {
    margin-bottom: 10px;
    font-size: 1.3rem;
}

.row-posters {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    scroll-behavior: smooth;
}

.row-posters::-webkit-scrollbar {
    display: none;
}

.poster {
    height: 220px;
    border-radius: 4px;
    transition: transform 0.3s;
    cursor: pointer;
}

.poster:hover {
    transform: scale(1.08);
}

/* Footer */
.footer {
    text-align: center;
    padding: 30px;
    color: #757575;
    font-size: 14px;
}

/* ========================= */
/* RESPONSIVE DESIGN */
/* ========================= */

/* Tablet */
@media (max-width: 992px) {
    .hero h1 {
        font-size: 2.2rem;
    }

    .poster {
        height: 180px;
    }
}

/* Mobile */
@media (max-width: 600px) {

    .navbar {
        padding: 10px 5%;
    }

    .logo {
        font-size: 20px;
    }

    .nav-links {
        display: none; /* hide menu on small screens */
    }

    .hero {
        height: 70vh;
    }

    .hero h1 {
        font-size: 1.8rem;
    }

    .hero p {
        font-size: 0.9rem;
    }

    .poster {
        height: 150px;
    }

    .row h2 {
        font-size: 1.1rem;
    }
}

</style>
</head>

<body>

<div class="navbar">
    <div class="logo">MovieFlix</div>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">TV Shows</a>
        <a href="#">Movies</a>
        <a href="#">My List</a>
    </div>
</div>

<div class="hero">
    <div class="hero-content">
        <h1>Featured Movie</h1>
        <p>Watch the latest blockbuster movies and trending shows anytime, anywhere.</p>
        <div class="hero-buttons">
            <button class="play-btn">▶ Play</button>
            <button class="info-btn">More Info</button>
        </div>
    </div>
</div>

<div class="row">
    <h2>Trending Now</h2>
    <div class="row-posters">
        <img class="poster" src="https://via.placeholder.com/300x450">
        <img class="poster" src="https://via.placeholder.com/300x450">
        <img class="poster" src="https://via.placeholder.com/300x450">
        <img class="poster" src="https://via.placeholder.com/300x450">
        <img class="poster" src="https://via.placeholder.com/300x450">
    </div>
</div>

<div class="row">
    <h2>Top Rated</h2>
    <div class="row-posters">
        <img class="poster" src="https://via.placeholder.com/300x450">
        <img class="poster" src="https://via.placeholder.com/300x450">
        <img class="poster" src="https://via.placeholder.com/300x450">
        <img class="poster" src="https://via.placeholder.com/300x450">
        <img class="poster" src="https://via.placeholder.com/300x450">
    </div>
</div>

<div class="footer">
    © 2026 MovieFlix. All rights reserved.
</div>

</body>
</html>
