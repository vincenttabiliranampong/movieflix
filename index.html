<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieFlix</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #111;
    font-family: Arial, sans-serif;
    color: white;
}

/* NAVBAR */
.navbar {
    position: fixed;
    width: 100%;
    padding: 20px 40px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    z-index: 100;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #e50914;
}

/* HERO SECTION */
.hero {
    height: 70vh;
    background: url("images/hero.jpg") center/cover no-repeat;
    display: flex;
    align-items: center;
    padding-left: 50px;
}

.hero-content {
    max-width: 500px;
}

.hero h1 {
    font-size: 50px;
}

.hero p {
    margin: 20px 0;
}

.hero button {
    padding: 10px 20px;
    border: none;
    background-color: #e50914;
    color: white;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
}

/* MOVIE SECTIONS */
.section {
    padding: 40px;
}

.section h2 {
    margin-bottom: 20px;
}

.row {
    display: flex;
    gap: 15px;
    overflow-x: auto;
}

.row::-webkit-scrollbar {
    display: none;
}

.movie {
    min-width: 180px;
    transition: transform 0.3s;
}

.movie img {
    width: 100%;
    border-radius: 8px;
    cursor: pointer;
}

.movie:hover {
    transform: scale(1.1);
}

/* MOBILE */
@media (max-width: 768px) {
    .hero h1 {
        font-size: 30px;
    }

    .section {
        padding: 20px;
    }

    .movie {
        min-width: 140px;
    }
}
</style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">MovieFlix</div>
</div>

<!-- HERO -->
<div class="hero">
    <div class="hero-content">
        <h1>Welcome to MovieFlix</h1>
        <p>Watch the latest trending movies trailers now.</p>
        <button>Watch Now</button>
    </div>
</div>

<!-- TRENDING -->
<div class="section">
    <h2>Trending</h2>
    <div class="row">

        <!-- MOVIE 1 -->
        <div class="movie">
            <a href="https://www.youtube.com/watch?v=YOUR_LINK_1" target="_blank">
                <img src="images/heart-of-stone.jpg">
            </a>
        </div>

        <!-- MOVIE 2 -->
        <div class="movie">
            <a href="https://www.youtube.com/watch?v=YOUR_LINK_2" target="_blank">
                <img src="images/bat-mitzvah.jpg">
            </a>
        </div>

        <!-- MOVIE 3 -->
        <div class="movie">
            <a href="https://www.youtube.com/watch?v=YOUR_LINK_3" target="_blank">
                <img src="images/living.jpg">
            </a>
        </div>

        <!-- MOVIE 4 -->
        <div class="movie">
            <a href="https://www.youtube.com/watch?v=YOUR_LINK_4" target="_blank">
                <img src="images/65.jpg">
            </a>
        </div>

        <!-- MOVIE 5 -->
        <div class="movie">
            <a href="https://www.youtube.com/watch?v=YOUR_LINK_5" target="_blank">
                <img src="images/missing.jpg">
            </a>
        </div>

    </div>
</div>

<!-- POPULAR -->
<div class="section">
    <h2>Popular</h2>
    <div class="row">

        <!-- You can reuse or change these -->

        <div class="movie">
            <a href="https://www.youtube.com/watch?v=YOUR_LINK_1" target="_blank">
                <img src="images/heart-of-stone.jpg">
            </a>
        </div>

        <div class="movie">
            <a href="https://www.youtube.com/watch?v=YOUR_LINK_2" target="_blank">
                <img src="images/bat-mitzvah.jpg">
            </a>
        </div>

        <div class="movie">
            <a href="https://www.youtube.com/watch?v=YOUR_LINK_3" target="_blank">
                <img src="images/living.jpg">
            </a>
        </div>

        <div class="movie">
            <a href="https://www.youtube.com/watch?v=YOUR_LINK_4" target="_blank">
                <img src="images/65.jpg">
            </a>
        </div>

        <div class="movie">
            <a href="https://www.youtube.com/watch?v=YOUR_LINK_5" target="_blank">
                <img src="images/missing.jpg">
            </a>
        </div>

    </div>
</div>

</body>
</html>
